name: student_tab
description: "EduForge – AI-powered Student Tablet App"
publish_to: 'none'
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  eduforge_core:
    path: ../eduforge_core
  supabase_flutter: ^2.9.0
  flutter_bloc: ^9.0.0
  hydrated_bloc: ^10.0.0
  path_provider: ^2.1.5
  go_router: ^15.0.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  rename: ^3.0.2

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "../eduforge_core/assets/logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "../eduforge_core/assets/logo.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
