name: admin_panel
description: "EduForge – AI-powered Teacher Panel for Windows"
publish_to: 'none'
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  eduforge_core:
    path: ../eduforge_core
  equatable: ^2.0.7
  supabase_flutter: ^2.9.0
  flutter_bloc: ^9.0.0
  hydrated_bloc: ^10.0.0
  path_provider: ^2.1.5
  go_router: ^15.0.0
  http: ^1.2.0
  file_picker: ^8.0.0
  syncfusion_flutter_pdf: ^27.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  rename: ^3.0.2

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "../eduforge_core/assets/logo.jpg"
    icon_size: 48

flutter:
  uses-material-design: true
